name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  connector:
    name: Connector tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector/budcom_connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: connector/budcom_connector/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  contract:
    name: OpenAPI contract validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/contract/package-lock.json
      - run: npm ci
      - run: npm test

  dart:
    name: Dart packages and Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: dart pub get
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test
